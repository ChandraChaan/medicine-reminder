name: medicine_reminder
description: "A medicine reminder for elderly parents: loud alarms, spoken reminders in Telugu, Hindi or English, and an optional family check. Everything stays on the phone."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_tts: ^4.2.5
  go_router: ^18.1.1
  image_picker: ^1.2.4
  intl: ^0.20.2
  meta: ^1.18.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
